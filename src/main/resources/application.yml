spring:
  application:
    name: doc-agent
  profiles:
    # 本地覆盖配置（含密钥）放 application-local.yml（已 gitignore）
    default: local
  # spring-ai-alibaba-starter 会连带拉起 Nacos 配置/注册客户端，本项目不需要，显式关闭
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
        register-enabled: false
  datasource:
    # 默认内嵌 H2 文件库：零外部依赖，克隆即跑。团队/生产环境用 --spring.profiles.active=pg 切 PostgreSQL。
    url: jdbc:h2:file:./data/docagent;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    dashscope:
      api-key: ${LLM_API_KEY:}
      read-timeout: ${LLM_READ_TIMEOUT_SEC:60}
      chat:
        options:
          model: ${LLM_MODEL:qwen-plus}
    chat:
      client:
        observations:
          log-prompt: ${AI_OBS_LOG_PROMPT:true}
          log-completion: ${AI_OBS_LOG_COMPLETION:true}
      # ChatMemory 表 DDL 由 db/schema.sql 统一管理（Spring AI 1.0.0 缺 H2 schema 变体）
      memory:
        repository:
          jdbc:
            initialize-schema: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid

server:
  port: 8020

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      # Nacos 健康检查：本项目不依赖 Nacos 服务端，关闭该指示器
  health:
    nacos-config:
      enabled: false
  tracing:
    sampling:
      # 求职 Demo 默认不依赖本地 OTLP Collector。
      probability: ${OTEL_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      transport: grpc

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-}] %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-}] %logger{50} - %msg%n"
  file:
    name: logs/doc-agent.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
    clean-history-on-startup: true

docagent:
  # 当前 prompt/分析行为版本——校准对照的版本锚点；每次改 prompt 或分析行为后递增，
  # 提交时未手填版本标注的运行自动带上此值（手填优先）。
  prompt-version: v7
  llm:
    # LLM HTTP 客户端超时（秒）：连接超时防握手挂起，读超时防响应僵死。
    # （log.txt 事故：JDK HttpClient 无默认读超时，单次调用挂 15 分钟触发 stale 重排双执行）。
    # 流式调用的“块间间隔”超时用同一读超时值（LlmGateway.invokeStream 的 Flux.timeout）。
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SEC:10}
    read-timeout-seconds: ${LLM_READ_TIMEOUT_SEC:180}
  analysis:
    # 演示模式：简历分析不调 LLM，直接返回预置假结论（mock/resume-review-mock.json），
    # 前端联调/展示用；追问同样返回预置回答。不写结论缓存。
    # 【当前默认开启】回到真实分析：设环境变量 ANALYSIS_MOCK_ENABLED=false，或把下面的默认值改回 false。
    mock-result-enabled: ${ANALYSIS_MOCK_ENABLED:true}
    # 结论缓存：同简历（内容哈希）+ 同分析输入（技能/指令/JD/方向/人群/prompt 版本）直接复用
    # 历史结论，跳过整条 LLM 流水线；forceRefresh 提交参数可强制重跑并覆盖。
    # 简历档案（resume_profile）不受此开关影响——免上传再分析始终可用。
    result-cache-enabled: true
    # 短文档路由：字符数低于此值的文档跳过 ReAct 直接单轮分析（短文档迭代精读无信息增量，
    # 实测只烧 token 且易循环不收敛）；0=关闭阈值恢复全量走循环。
    react-max-chars: 8000
    dispatcher:
      # DB 队列轮询间隔与自愈扫描（多实例水平扩展：CAS 认领互斥）
      poll-ms: 1000
      requeue-scan-ms: 60000
      # 超过该时长未推进的 run 重新入队由任意实例续跑
      requeue-stale-minutes: 15
    loop:
      max-rounds: 10
      max-tool-calls: 16
      max-total-tokens: 60000
      parallel-tools: true

opsmind:
  llm:
    routing:
      # 兜底模型：callName 未命中时用。文档分析是核心链路，默认 qwen-plus 保效果。
      default-model: ${LLM_DEFAULT_MODEL:qwen-plus}
      # 简单任务用的快模型（省成本）。
      simple-model: ${LLM_SIMPLE_MODEL:qwen-turbo}
      # 走 simple-model 的 callName（简单结构化任务，用快模型省成本、效果不损）。
      simple-calls:
        - llm.context-summarize
      # 判断类调用走强模型：主结论与评价专调是质量瓶颈（档位判断/含金量评估/
      # 市场校准恰是中档模型与前沿模型差距最大的任务）；简历全文仅数千 token，
      # 强模型成本影响可忽略。LLM_STRONG_MODEL 可整体换型（如 deepseek-v3）。
      mappings:
        llm.resume-review: ${LLM_STRONG_MODEL:qwen-max}
        llm.resume-evaluation: ${LLM_STRONG_MODEL:qwen-max}
      # 模型 → 上下文窗口（token）。供 truncate 按目标模型窗口动态截断 userContent。
      model-windows:
        qwen-turbo: 8192
        qwen-plus: 32768
        qwen-max: 32768
      default-model-window: ${DEFAULT_MODEL_WINDOW:8192}
      context:
        max-chars-per-segment: ${LLM_CONTEXT_MAX_CHARS_PER_SEGMENT:4000}
        overlap-chars: ${LLM_CONTEXT_OVERLAP_CHARS:200}
        max-segments: ${LLM_CONTEXT_MAX_SEGMENTS:10}
      # run 级短期记忆：按 runId 隔离对话历史（文档多轮分析复用上下文）。
      chat-memory:
        enabled: ${CHAT_MEMORY_ENABLED:true}
        history-size: ${CHAT_MEMORY_HISTORY_SIZE:10}
        summarize: ${CHAT_MEMORY_SUMMARIZE:true}
        context-window-tokens: ${CHAT_MEMORY_CONTEXT_WINDOW_TOKENS:28000}
        summarize-threshold-ratio: ${CHAT_MEMORY_SUMMARIZE_THRESHOLD:0.65}
        keep-recent-messages: ${CHAT_MEMORY_KEEP_RECENT:6}

resilience4j:
  retry:
    instances:
      llm-default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 8s
        retryExceptions:
          - com.gcll.docagent.resilience.RetryableCallException
        ignoreExceptions:
          - com.gcll.docagent.resilience.NonRetryableCallException
      tool-default:
        maxAttempts: 1
  timelimiter:
    instances:
      llm-default: { timeoutDuration: 90s }
      tool-default: { timeoutDuration: 10s }
  ratelimiter:
    instances:
      llm-default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      tool-default:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
  circuitbreaker:
    instances:
      llm-default:
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 45s
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
