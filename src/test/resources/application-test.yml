spring:
  application:
    name: doc-agent-test
  datasource:
    url: jdbc:h2:mem:doc_agent_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  ai:
    dashscope:
      api-key: test-key
    chat:
      memory:
        repository:
          jdbc:
            # 测试用 H2，但 Spring AI ChatMemory 的 JDBC starter 没带 schema-h2.sql，
            # 关掉自动建表避免启动失败。测试不依赖 ChatMemory 持久化（单测走 mock）。
            initialize-schema: never

docagent:
  analysis:
    # 测试默认真实行为：演示模式（主配置当前默认开启）与结论缓存都在此显式关闭，
    # 需要的测试类用 @TestPropertySource 显式打开。
    mock-result-enabled: false
    # 现有集成测试大量重复提交相同内容（校准轮/多用例同简历）——默认关闭结论缓存，
    # 避免用例间互相命中；缓存专属测试类用 @TestPropertySource 显式打开。
    result-cache-enabled: false
